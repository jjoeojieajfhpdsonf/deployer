<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Airlock</title>
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <!-- Favicon inline: kein Abruf, kein 404. Bildmarke provisorisch Variante 1 (docs/design-cal/marke,
         Wahl offen); hell #242424, dunkel #f2f2f3 über prefers-color-scheme -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3E.m%7Bfill:%23242424%7D@media (prefers-color-scheme: dark)%7B.m%7Bfill:%23f2f2f3%7D%7D%3C/style%3E%3Cg class='m'%3E%3Cpath d='M4 28V16a12 12 0 0 1 24 0v12h-4V16a8 8 0 0 0-16 0v12z'/%3E%3Cpath d='M12 28V16a4 4 0 0 1 8 0v12z'/%3E%3C/g%3E%3C/svg%3E" />
    <!-- Darstellung vor dem ersten Bild setzen (kein Aufblitzen): lokale Kopie
         der Wahl aus dem Profilmenü, sonst prefers-color-scheme. Die Wahl
         selbst liegt auf dem Server (lib/theme.ts). -->
    <script>
      (function () {
        var p = 'system'
        try { p = localStorage.getItem('airlock.theme') || localStorage.getItem('deployer.theme') || 'system' } catch (e) {}
        // Versteckte Themes: «Windows 95» (helles Schema) und «Terminal» (dunkles Schema), je eigenes Token-Set
        if (p === 'win95' || p === 'terminal') {
          document.documentElement.dataset.theme = p
          document.documentElement.style.colorScheme = p === 'terminal' ? 'dark' : 'light'
          return
        }
        var dark = p === 'dark' || (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <!-- Schriften kommen lokal über @fontsource (siehe main.tsx), nicht von
         Google Fonts: Airlock läuft im LAN und soll beim Aufruf nichts
         von aussen nachladen. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

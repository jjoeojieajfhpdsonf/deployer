<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>deployer</title>
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <!-- Favicon inline: kein Abruf, kein 404 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23242424'/%3E%3Cpath d='M13 10l6 6-6 6' fill='none' stroke='%23ffffff' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <!-- Darstellung vor dem ersten Bild setzen (kein Aufblitzen): lokale Kopie
         der Wahl aus dem Profilmenü, sonst prefers-color-scheme. Die Wahl
         selbst liegt auf dem Server (lib/theme.ts). -->
    <script>
      (function () {
        var p = 'system'
        try { p = localStorage.getItem('deployer.theme') || 'system' } catch (e) {}
        var dark = p === 'dark' || (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <!-- Schriften kommen lokal über @fontsource (siehe main.tsx), nicht von
         Google Fonts: der deployer läuft im LAN und soll beim Aufruf nichts
         von aussen nachladen. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

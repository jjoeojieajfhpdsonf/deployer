# Nur für die E2E-Tests von Meilenstein 5: deployer spricht mit einer
# Cloudflare-Attrappe auf dem Host statt mit api.cloudflare.com.
#
#   pnpm --filter @deployer/api e2e:cf
#
# Keine echten Werte: Konto, Tunnel und Token sind erfunden; das Token
# ("cf-test-token") erwartet nur die Attrappe.

services:
  deployer:
    environment:
      CLOUDFLARE_API_BASE: http://host.docker.internal:18787/client/v4
      CLOUDFLARE_ACCOUNT_ID: acc-e2e-test
      CLOUDFLARE_TUNNEL_ID: 00000000-0000-4000-8000-00000000e2e5
      ACCESS_EMAIL: joel@test.example
      CLOUDFLARE_API_TOKEN_FILE: /run/secrets/cloudflare_token
    secrets:
      - cloudflare_token

secrets:
  cloudflare_token:
    file: ./packages/api/e2e/cf-fake-token.txt

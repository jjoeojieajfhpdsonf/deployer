name: airlock

# Bestehende Installation unter dem alten Namen «deployer»: nicht einfach
# hochfahren, sondern mit scripts/rename-to-airlock.sh umziehen (docs/RENAME.md).
# Sonst startet ein leerer Stack neben dem alten.

x-logging: &logging
  # Feste Rotation, siehe SPEC: ohne Groessenlimit fuellen Container-Logs
  # unbemerkt die Platte.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    container_name: airlock-postgres
    environment:
      POSTGRES_USER: airlock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt (siehe .env.example)}
      POSTGRES_DB: airlock
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airlock -d airlock"]
      interval: 5s
      timeout: 3s
      retries: 20

  socket-proxy:
    # Einzige Tuer zur Docker-API. ACHTUNG: Der Proxy filtert Endpunkte,
    # nicht Nutzlasten - er verhindert keinen Root-Zugriff. Die eigentliche
    # Schranke ist die Erlaubnisliste in packages/api/src/drivers/docker.ts.
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    logging: *logging
    container_name: airlock-socket-proxy
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      VERSION: 1
      POST: 1
      # M2: Dockerfile-Builds und build: in Compose. Ein Build fuehrt fremde
      # RUN-Schritte aus, aber in einem eigenen Build-Container ohne
      # privileged (die Entitlement setzt die API hier nicht).
      BUILD: 1
      # Backup: restic und pg_dump laufen per exec im Container airlock-backup.
      # Der Proxy kann exec nicht auf einen Container beschraenken; die Schranke
      # ist die Erlaubnisliste in docker.ts (execIn: nur BACKUP_CONTAINER).
      EXEC: 1
      # Ausdruecklich aus:
      SWARM: 0
      SECRETS: 0
      SYSTEM: 0
      AUTH: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      NODES: 0
      PLUGINS: 0
      SERVICES: 0
      SESSION: 0
      TASKS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]

  caddy:
    # Caddy mit dem DNS-Modul für Cloudflare: das Wildcard-Zertifikat lässt
    # sich so jederzeit über die Systemseite einrichten, ohne Compose-Ergänzung.
    image: airlock/caddy-cloudflare:local
    build:
      context: ./caddy
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *logging
    container_name: airlock-caddy
    # --resume: nach einem Neustart von Caddy allein die zuletzt von Airlock
    # geladene Konfiguration (autosave.json) wiederherstellen. Ohne das laedt
    # Caddy nur das Bootstrap-Caddyfile, und alle Projekt-Routen fehlen, bis
    # Airlock selbst neu startet. Beim allerersten Start gibt es noch
    # keine Sicherung; dann gilt das Caddyfile.
    command: ["caddy", "run", "--resume", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "80:80"
      # Erst in Gebrauch, wenn das Zertifikat eingerichtet ist (System → Cloudflare)
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Admin-Socket. Kein TCP :2019 - siehe docs/MILESTONE-1.md.
      - caddy_admin:/run/caddy
      - sites:/srv/sites:ro
      # Cloudflare-Token als Datei, geschrieben von Airlock. Die Konfiguration
      # (und autosave.json) enthält nur den Pfad: {file./run/caddy-secrets/...}
      - caddy_secrets:/run/caddy-secrets:ro
    networks:
      edge:
        # Caddy wird zur Laufzeit in Projekt-Netze (air_*) gehaengt. Bei
        # gleicher Prioritaet waehlt Docker das alphabetisch erste Netz als
        # Gateway - "air_" sortiert vor "airlock_edge". Dann laeuft Caddys
        # Standardroute durch das Projekt-Netz, und beim Trennen reisst die
        # Port-Veroeffentlichung von :80 ab. Die hohe Prioritaet haelt das
        # Gateway fest auf edge.
        gw_priority: 100
      # Nur cloudflared und Caddy: was durch den Tunnel kommt, erreicht nur
      # Caddy – nie Airlock, nie ein Projekt-Netz.
      tunnel: {}

  airlock:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *logging
    container_name: airlock-app
    depends_on:
      postgres:
        condition: service_healthy
      caddy:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://airlock:${POSTGRES_PASSWORD}@postgres:5432/airlock
      DOCKER_HOST: tcp://socket-proxy:2375
      CADDY_ADMIN_SOCKET: /run/caddy/admin.sock
      DATA_DIR: /data
      SITES_DIR: /srv/sites
      AIRLOCK_CONTAINER: airlock-app
      CADDY_CONTAINER: airlock-caddy
      AIRLOCK_UPSTREAM: airlock-app:3000
      INTERNAL_BASE_DOMAIN: ${INTERNAL_BASE_DOMAIN:-}
      SERVER_LAN_IP: ${SERVER_LAN_IP:-}
      SERVER_NAME: ${SERVER_NAME:-}
      NIPIO_FALLBACK: ${NIPIO_FALLBACK:-on}
      CADDY_IP_FILTER: ${CADDY_IP_FILTER:-on}
      LAN_CIDR: ${LAN_CIDR:-192.168.1.0/24}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD fehlt (siehe .env.example)}
      SESSION_SECRET: ${SESSION_SECRET:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      DEFAULT_CPU_LIMIT: ${DEFAULT_CPU_LIMIT:-1}
      DEFAULT_MEMORY_LIMIT_MB: ${DEFAULT_MEMORY_LIMIT_MB:-512}
    volumes:
      - caddy_admin:/run/caddy
      - caddy_secrets:/run/caddy-secrets
      - sites:/srv/sites
      - data:/data
      # Caddys Zertifikatsspeicher: vorhandenes produktives Zertifikat erkennen,
      # Staging-Wildcards früherer Probeläufe löschen (CADDY_DATA_DIR)
      - caddy_data:/caddy-data
    networks:
      internal: {}
      edge:
        # Wie bei Caddy: Airlock haengt sich fuer den Healthcheck kurz in
        # Projekt-Netze. Sein Gateway soll dabei nicht dorthin wandern.
        gw_priority: 100
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backup:
    # Backup (docs/MILESTONE-BACKUP.md): restic (gepinnt in backup/Dockerfile)
    # und pg_dump. Tut von sich aus nichts; Airlock steuert ihn per exec ueber
    # den Socket-Proxy (nur diesen Container, siehe docker.ts).
    image: airlock/backup:local
    build:
      context: ./backup
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *logging
    container_name: airlock-backup
    # Feste Kennung: restic merkt sich den Host je Stand (Aufbewahrung, forget)
    hostname: airlock-backup
    # Reapt die per exec gestarteten Prozesse
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # pg_dump ueber das interne Netz
      PGHOST: postgres
      PGUSER: airlock
      PGDATABASE: airlock
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt (siehe .env.example)}
    volumes:
      # Gesichert wird nur gelesen. keys/ (secrets.key) liegt im Daten-Volume und
      # wird per restic --exclude ausgeschlossen (backup/restic.ts, Test dazu):
      # der Schluessel wird getrennt gesichert, nie im selben Backup.
      - caddy_data:/source/caddy_data:ro
      - sites:/source/sites:ro
      - data:/source/data:ro
      # Datenbank-Dump und Kopien der Projekt-Volumes (BACKUP_STAGING_VOLUME)
      - backup_staging:/staging
      # Lokales Ziel: BACKUP_LOCAL_DIR=/pfad/auf/dem/server (auch ein NAS-Mount);
      # ohne Angabe ein eigenes Volume. Im Ziel-Pfad der Oberflaeche: /target/…
      - ${BACKUP_LOCAL_DIR:-backup_local}:/target
    networks:
      # Datenbank
      - internal
      # S3-Ziele (Backblaze B2, Cloudflare R2) brauchen den Weg nach draussen;
      # internal hat keinen. Nur dieser Container haengt in diesem Netz.
      - backup_egress

networks:
  internal:
    name: airlock_internal
    internal: true
  # Nur der Backup-Container: ausgehend zu S3, kein anderer Dienst darin
  backup_egress:
    name: airlock_backup_egress
  edge:
    name: airlock_edge
  # cloudflared (von Airlock gestartet) und Caddy. Nicht internal: cloudflared
  # braucht die ausgehende Verbindung zu Cloudflare.
  tunnel:
    name: airlock_tunnel

# Docker-Namen: airlock_<schlüssel> (airlock_pgdata, airlock_data, …).
# Früher deployer_<schlüssel>; das Daten-Volume hiess deployer_deployer_data.
volumes:
  pgdata:
  caddy_data:
  caddy_config:
  caddy_admin:
  caddy_secrets:
  sites:
  data:
  # Backup: Staging (Name fest, Airlock haengt es in Wegwerf-Container fuer
  # die Projekt-Volumes) und das Standard-Ziel ohne BACKUP_LOCAL_DIR
  backup_staging:
    name: airlock_backup_staging
  backup_local:

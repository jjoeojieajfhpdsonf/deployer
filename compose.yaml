name: airlock

# Bestehende Installation unter dem alten Namen «deployer»: nicht einfach
# hochfahren, sondern mit scripts/rename-to-airlock.sh umziehen (docs/RENAME.md).
# Sonst startet ein leerer Stack neben dem alten.

x-logging: &logging
  # Feste Rotation, siehe SPEC: ohne Groessenlimit fuellen Container-Logs
  # unbemerkt die Platte.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# HomeBento (Dashboard für den ganzen Homeserver) schlägt Container anhand von
# Labels als Kacheln vor. Airlocks eigene Dienste gehören nicht dazu – nur die
# Projekte (die bekommen homebento.name/href von Airlock). README «Mit HomeBento».
x-homebento-ignore: &homebento-ignore
  homebento.ignore: "true"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    container_name: airlock-postgres
    labels: *homebento-ignore
    environment:
      POSTGRES_USER: airlock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt (siehe .env.example)}
      POSTGRES_DB: airlock
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airlock -d airlock"]
      interval: 5s
      timeout: 3s
      retries: 20

  socket-proxy:
    # Einzige Tuer zur Docker-API. ACHTUNG: Der Proxy filtert Endpunkte,
    # nicht Nutzlasten - er verhindert keinen Root-Zugriff. Die eigentliche
    # Schranke ist die Erlaubnisliste in packages/api/src/drivers/docker.ts.
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    logging: *logging
    container_name: airlock-socket-proxy
    labels: *homebento-ignore
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      VERSION: 1
      POST: 1
      # M2: Dockerfile-Builds und build: in Compose. Ein Build fuehrt fremde
      # RUN-Schritte aus, aber in einem eigenen Build-Container ohne
      # privileged (die Entitlement setzt die API hier nicht).
      BUILD: 1
      # Nacht 3, Etappe 3 (Server › Speicher): GET /system/df – Belegung wie
      # «docker system df» (Images, Container, Volumes, Build-Cache). Unter
      # /system gibt es in der Docker-API nur diesen einen, lesenden Endpunkt.
      # Das Aufraeumen selbst braucht nichts Neues: Images/Container/Volumes
      # entfernen und POST /build/prune liegen unter IMAGES, CONTAINERS,
      # VOLUMES und BUILD (oben). Test: storage/compose.test.ts.
      SYSTEM: 1
      # Nacht 3, Etappe 5 (Einbruchserkennung) braucht nichts Neues: GET
      # /containers/{id}/top («docker top»), /changes («docker diff»), HEAD
      # /archive (Rechte einer Datei) und POST /update (Restart-Policy beim
      # Isolieren) liegen unter CONTAINERS (+ POST). Test: intrusion/cli-notify.test.ts.
      # Ausdruecklich aus:
      # EXEC: der Proxy kann exec nicht auf einen Container beschraenken. Das
      # Backup braucht es nicht: Airlock legt Auftraege in das Volume
      # backup_jobs, der Backup-Container fuehrt sie selbst aus (backup/runner.sh).
      EXEC: 0
      SWARM: 0
      SECRETS: 0
      AUTH: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      NODES: 0
      PLUGINS: 0
      SERVICES: 0
      SESSION: 0
      TASKS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]

  caddy:
    # Caddy mit dem DNS-Modul für Cloudflare: das Wildcard-Zertifikat lässt
    # sich so jederzeit über die Systemseite einrichten, ohne Compose-Ergänzung.
    image: airlock/caddy-cloudflare:local
    build:
      context: ./caddy
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *logging
    container_name: airlock-caddy
    labels: *homebento-ignore
    # --resume: nach einem Neustart von Caddy allein die zuletzt von Airlock
    # geladene Konfiguration (autosave.json) wiederherstellen. Ohne das laedt
    # Caddy nur das Bootstrap-Caddyfile, und alle Projekt-Routen fehlen, bis
    # Airlock selbst neu startet. Beim allerersten Start gibt es noch
    # keine Sicherung; dann gilt das Caddyfile.
    command: ["caddy", "run", "--resume", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "80:80"
      # Erst in Gebrauch, wenn das Zertifikat eingerichtet ist (System → Cloudflare)
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Admin-Socket. Kein TCP :2019 - siehe docs/MILESTONE-1.md.
      - caddy_admin:/run/caddy
      - sites:/srv/sites:ro
      # Cloudflare-Token als Datei, geschrieben von Airlock. Die Konfiguration
      # (und autosave.json) enthält nur den Pfad: {file./run/caddy-secrets/...}
      - caddy_secrets:/run/caddy-secrets:ro
      # Etappe 3 «Besucher»: Zugriffs-Log der Projekte als JSON-Datei mit
      # Rotation (20 MB, 2 alte Dateien, höchstens 2 Tage). Enthält IPs; Airlock
      # liest nur mit und speichert Zähler. Nicht im Backup.
      - caddy_access:/var/log/airlock-access
    networks:
      edge:
        # Caddy wird zur Laufzeit in Projekt-Netze (air_*) gehaengt. Bei
        # gleicher Prioritaet waehlt Docker das alphabetisch erste Netz als
        # Gateway - "air_" sortiert vor "airlock_edge". Dann laeuft Caddys
        # Standardroute durch das Projekt-Netz, und beim Trennen reisst die
        # Port-Veroeffentlichung von :80 ab. Die hohe Prioritaet haelt das
        # Gateway fest auf edge.
        gw_priority: 100
      # Nur cloudflared und Caddy: was durch den Tunnel kommt, erreicht nur
      # Caddy – nie Airlock, nie ein Projekt-Netz.
      tunnel: {}
      # Etappe 5: nur Caddy und airlock-status (status.<hauptzone> → Dateien)
      status: {}

  airlock:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *logging
    container_name: airlock-app
    # Auch Airlock selbst: in HomeBento von Hand als Dienst mit dem Plugin anlegen (README)
    labels: *homebento-ignore
    depends_on:
      postgres:
        condition: service_healthy
      caddy:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://airlock:${POSTGRES_PASSWORD}@postgres:5432/airlock
      DOCKER_HOST: tcp://socket-proxy:2375
      CADDY_ADMIN_SOCKET: /run/caddy/admin.sock
      DATA_DIR: /data
      SITES_DIR: /srv/sites
      AIRLOCK_CONTAINER: airlock-app
      CADDY_CONTAINER: airlock-caddy
      AIRLOCK_UPSTREAM: airlock-app:3000
      INTERNAL_BASE_DOMAIN: ${INTERNAL_BASE_DOMAIN:-}
      SERVER_LAN_IP: ${SERVER_LAN_IP:-}
      SERVER_NAME: ${SERVER_NAME:-}
      NIPIO_FALLBACK: ${NIPIO_FALLBACK:-on}
      CADDY_IP_FILTER: ${CADDY_IP_FILTER:-on}
      LAN_CIDR: ${LAN_CIDR:-192.168.1.0/24}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD fehlt (siehe .env.example)}
      SESSION_SECRET: ${SESSION_SECRET:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      DEFAULT_CPU_LIMIT: ${DEFAULT_CPU_LIMIT:-1}
      DEFAULT_MEMORY_LIMIT_MB: ${DEFAULT_MEMORY_LIMIT_MB:-512}
      # Etappe 5: Ablage der Statusseite (Volume status_site) und ihr Container
      STATUS_DIR: /srv/status
      STATUS_UPSTREAM: airlock-status:8080
    volumes:
      - caddy_admin:/run/caddy
      - caddy_secrets:/run/caddy-secrets
      - sites:/srv/sites
      - data:/data
      # Caddys Zertifikatsspeicher: vorhandenes produktives Zertifikat erkennen,
      # Staging-Wildcards früherer Probeläufe löschen (CADDY_DATA_DIR)
      - caddy_data:/caddy-data
      # Auftraege an den Backup-Container (BACKUP_JOBS_DIR, tmpfs)
      - backup_jobs:/backup-jobs
      # Etappe 3: Zugriffs-Log von Caddy, nur lesen (ACCESS_LOG_DIR)
      - caddy_access:/caddy-access:ro
      # Etappe 5: Statusseite – nur Airlock schreibt (STATUS_DIR), airlock-status liest
      - status_site:/srv/status
      # Nacht 3, Etappe 4: Ausgangsregeln an den Firewall-Dienst (FIREWALL_DIR)
      - firewall:/firewall
    networks:
      internal: {}
      edge:
        # Wie bei Caddy: Airlock haengt sich fuer den Healthcheck kurz in
        # Projekt-Netze. Sein Gateway soll dabei nicht dorthin wandern.
        gw_priority: 100
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  status:
    # Etappe 5 «Statusseite»: liefert nur die Dateien aus, die Airlock jede
    # Minute in status_site schreibt (je Umgebung ein Ordner). Öffentlich über
    # den Tunnel: cloudflared → Caddy (status.<hauptzone>, Security-Header,
    # Pfad /<umgebung>/…) → dieser Container.
    # Bewusst abgeschottet (Test: packages/api/src/status/compose.test.ts):
    # - nur im Netz «status» (internal, darin nur Caddy) – kein Weg zu Airlock,
    #   zur Datenbank, zum Socket-Proxy oder nach draussen
    # - kein Docker-Socket, keine Secrets, keine Umgebungsvariablen mit Werten
    # - Volume nur lesend, Dateisystem nur lesend, als «nobody», ohne
    #   Capabilities ausser NET_BIND_SERVICE (siehe unten)
    # Dasselbe Caddy-Image wie die Basis von caddy/Dockerfile (schon auf dem
    # Server), aber nur «caddy file-server»: keine Admin-API, kein TLS.
    # Start prüfen: scripts/smoke-status.sh (startet den Dienst mit genau
    # dieser Härtung, ruft eine Datei ab, räumt ab).
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    logging: *logging
    container_name: airlock-status
    labels: *homebento-ignore
    command: ["caddy", "file-server", "--root", "/srv/status", "--listen", ":8080"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    # Das Caddy-Image setzt auf /usr/bin/caddy die Datei-Capability
    # cap_net_bind_service. Fehlt sie im Bounding-Set (cap_drop: ALL), lehnt
    # der Kernel schon den exec ab: «exec /usr/bin/caddy: operation not
    # permitted». Nur sie zurück – Port 8080 bräuchte sie nicht, aber ohne sie
    # startet das Programm gar nicht. Sonst nichts gelockert.
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    # Caddy legt beim Start seine Ordner an; im Speicher, nicht im Image
    tmpfs:
      - /data
      - /config
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    volumes:
      - status_site:/srv/status:ro
    networks: [status]

  firewall:
    # Nacht 3, Etappe 4 «Container-Ausgang begrenzen»: setzt die Regeln, die
    # Airlock in das Volume firewall schreibt (rules.nft), in EINER eigenen
    # nftables-Tabelle (inet airlock). Gilt nur für Verkehr aus den Bridges
    # der Projekt-Netze (air_*): Caddy, Airlock, Datenbank, Socket-Proxy,
    # cloudflared, Backup und Statusseite sind nie betroffen; Docker-Regeln und
    # die Tailscale-Regel (mangle POSTROUTING) fasst der Dienst nicht an.
    # - network_mode: host – die Regeln gehören in den Netz-Namensraum des Hosts
    # - nur NET_ADMIN (nft, NFLOG lesen); kein Socket, kein Netz zu Airlock,
    #   kein offener Port; Dateisystem nur lesend
    # - prüft jeden Stand gegen eine feste Grammatik (firewall/airlock-fw):
    #   auch ein falscher Stand kann SSH, LAN oder Tailscale nicht aussperren
    # Notausgang: docker exec airlock-firewall airlock-fw flush (docs/INSTALL.md)
    # Gestoppt oder abgestürzt bleiben die Regeln im Kernel stehen (sicher);
    # beim Start baut der Dienst die Tabelle aus rules.nft neu auf.
    # Prüfen: scripts/smoke-ausgang.sh
    image: airlock/firewall:local
    build:
      context: ./firewall
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *logging
    container_name: airlock-firewall
    labels: *homebento-ignore
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    volumes:
      # rules.nft (von Airlock), status.json und events.log (von hier), disabled (Notausgang)
      - firewall:/firewall

  backup:
    # Backup (docs/MILESTONE-BACKUP.md): restic (gepinnt in backup/Dockerfile)
    # und pg_dump. Eigener Dienst ohne exec: der Ausfuehrer (backup/runner.sh)
    # holt Auftraege aus /jobs (Volume backup_jobs), fuehrt nur feste Vorgaenge
    # aus (restic mit erlaubten Unterbefehlen, pg_dump, Staging leeren) und
    # schreibt Ausgabe und Ergebnis zurueck. Zeitplan und Regeln bleiben in
    # Airlock. Projekt-Container stoppen/starten und Projekt-Volumes ins
    # Staging kopieren macht Airlock ueber den Socket-Proxy, nicht dieser Dienst.
    image: airlock/backup:local
    build:
      context: ./backup
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *logging
    container_name: airlock-backup
    labels: *homebento-ignore
    # Feste Kennung: restic merkt sich den Host je Stand (Aufbewahrung, forget)
    hostname: airlock-backup
    # Reapt die Prozesse der Auftraege, leitet SIGTERM an den Ausfuehrer weiter
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # pg_dump ueber das interne Netz
      PGHOST: postgres
      PGUSER: airlock
      PGDATABASE: airlock
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt (siehe .env.example)}
    volumes:
      # Gesichert wird nur gelesen. keys/ (secrets.key) liegt im Daten-Volume und
      # wird per restic --exclude ausgeschlossen (backup/restic.ts, Test dazu):
      # der Schluessel wird getrennt gesichert, nie im selben Backup.
      - caddy_data:/source/caddy_data:ro
      - sites:/source/sites:ro
      - data:/source/data:ro
      # Datenbank-Dump und Kopien der Projekt-Volumes (BACKUP_STAGING_VOLUME)
      - backup_staging:/staging
      # Auftraege von Airlock: <id>.job, Geheimnisse kurz in <id>.env (0600,
      # nach dem Lesen geloescht), Ergebnis in <id>.result
      - backup_jobs:/jobs
      # Lokales Ziel: BACKUP_LOCAL_DIR=/pfad/auf/dem/server (auch ein NAS-Mount);
      # ohne Angabe ein eigenes Volume. Im Ziel-Pfad der Oberflaeche: /target/…
      - ${BACKUP_LOCAL_DIR:-backup_local}:/target
    networks:
      # Datenbank
      - internal
      # S3-Ziele (Backblaze B2, Cloudflare R2) brauchen den Weg nach draussen;
      # internal hat keinen. Nur dieser Container haengt in diesem Netz.
      - backup_egress

networks:
  internal:
    name: airlock_internal
    internal: true
  # Nur der Backup-Container: ausgehend zu S3, kein anderer Dienst darin
  backup_egress:
    name: airlock_backup_egress
  edge:
    name: airlock_edge
  # cloudflared (von Airlock gestartet) und Caddy. Nicht internal: cloudflared
  # braucht die ausgehende Verbindung zu Cloudflare.
  tunnel:
    name: airlock_tunnel
  # Etappe 5: nur Caddy und airlock-status. internal: kein Weg nach draussen.
  status:
    name: airlock_status
    internal: true

# Docker-Namen: airlock_<schlüssel> (airlock_pgdata, airlock_data, …).
# Früher deployer_<schlüssel>; das Daten-Volume hiess deployer_deployer_data.
volumes:
  pgdata:
  caddy_data:
  caddy_config:
  caddy_admin:
  caddy_secrets:
  # Etappe 3: Zugriffs-Log der Projekte (Caddy schreibt, Airlock liest)
  caddy_access:
  # Etappe 5: Statusseite (Airlock schreibt, airlock-status liest)
  status_site:
  # Nacht 3, Etappe 4: gewünschte Ausgangsregeln (Airlock) und Zustand/Protokoll
  # des Firewall-Dienstes. Auf der Platte, nicht tmpfs: nach einem Neustart des
  # Servers baut der Dienst die Regeln sofort wieder auf, noch bevor Airlock läuft.
  firewall:
    name: airlock_firewall
  sites:
  data:
  # Backup: Staging (Name fest, Airlock haengt es in Wegwerf-Container fuer
  # die Projekt-Volumes) und das Standard-Ziel ohne BACKUP_LOCAL_DIR
  backup_staging:
    name: airlock_backup_staging
  # Auftraege zwischen Airlock und dem Backup-Container. tmpfs: die kurzlebige
  # Datei mit Repository-Passwort und S3-Schluessel erreicht nie eine Platte
  # und ist nach einem Neustart des Servers weg. Beide Dienste laufen als root.
  backup_jobs:
    name: airlock_backup_jobs
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=64m,mode=0700"
  backup_local:

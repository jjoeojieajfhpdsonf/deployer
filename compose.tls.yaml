# ALT – nur noch für bestehende Installationen.
#
# Neu wird HTTPS über die Oberfläche eingerichtet: System → «Cloudflare
# verbinden» (Token, Basisdomain, Zertifikat). Diese Datei braucht es dafür
# nicht mehr; Caddy mit dem DNS-Modul und Port 443 sind im Basis-Stack.
#
# Wer schon so eingerichtet ist, kann sie weiter verwenden:
#
#   docker compose -f compose.yaml -f compose.tls.yaml up -d --build
#
#   - INTERNAL_BASE_DOMAIN in .env, z.B. int.deinedomain.ch
#   - secrets/cloudflare_token mit dem Token, Rechte 600
#   - optional TAILSCALE_IP, ACME_EMAIL, ACME_CA=staging
#
# Sobald über die Oberfläche ein Token gespeichert ist, gilt jenes; diese
# Werte bleiben nur der Rückfall.

services:
  caddy:
    secrets:
      - cloudflare_token

  airlock:
    environment:
      TLS_MODE: cloudflare
      ACME_CA: ${ACME_CA:-production}
      ACME_EMAIL: ${ACME_EMAIL:-}
      TAILSCALE_IP: ${TAILSCALE_IP:-}
      CLOUDFLARE_API_TOKEN_FILE: /run/secrets/cloudflare_token
    secrets:
      - cloudflare_token

secrets:
  cloudflare_token:
    file: ./secrets/cloudflare_token
